 useEffect(()=>{document.documentElement.dataset.theme=theme},[theme]);useEffect(()=>{const f=()=>setRoute(location.hash.slice(1)||(store.get("profile",DEF).onboarded?"home":"signin"));addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
 const go=r=>{if(location.hash.slice(1)===r)setRoute(r);else location.hash=r;scrollTo(0,0)};
 const career=CAREERS_DB.find(c=>c.id===rm.career)||CAREERS_DB[1],road=useMemo(()=>genRoadmap(career,p),[career,p.hours,p.level,p.langs,rm.ver]);
 const n=Object.keys(prog).filter(k=>prog[k]&&k[0]!=="q").length,achievements=[{t:"Profile created",on:p.onboarded},{t:"First lesson done",on:n>0},{t:"Ten lessons done",on:n>=10},{t:"Stage 1 complete",on:Array.from({length:road[0].topics.length+1}).every((_,j)=>prog["0:"+j])},{t:"First project started",on:Object.keys(ps).length>0},{t:"First quiz taken",on:quiz.length>0}];
 const toast=m=>{setTm(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setTm(null),2400)},note=m=>setAct(a=>[m,...a].slice(0,8));
 const S={skills,setSkills,days,setDays,rbm,setRbm,act,toast,note,theme,setTheme,p,setP,rm,setRm,prog,setProg,log,setLog,bm,setBm,cmp,setCmp,pbm,setPbm,ps,setPs,goals,setGoals,quiz,setQuiz,chat,setChat,focus,setFocus,pending,setPending,career,road,achievements};
 const pub=["home","onboarding","signin","about","contact"].includes(route),prot=!pub&&!p.onboarded;
 useEffect(()=>{document.title="NEXORA — Discover Your Potential. Design Your Future."},[]);
 return<Ctx.Provider value={S}><Boundary>{route==="home"?<Landing go={go}/>:route==="about"?<About go={go}/>:route==="contact"?<Contact go={go}/>:route==="onboarding"?<Onboarding go={go}/>:route==="signin"?<SignIn go={go}/>:prot?<div className="center"><Empty t="Create your profile first" d="The dashboard is available once you have a (local) profile. It only takes a minute and every question is optional." a={<button className="btn pri" onClick={()=>go("onboarding")}>Start Your Journey</button>}/></div>:<Shell route={route} go={go}/>}</Boundary><div className="toast" role="status" aria-live="polite" style={{display:tm?"block":"none"}}>{tm}</div></Ctx.Provider>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
